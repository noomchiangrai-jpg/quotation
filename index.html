<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบใบเสนอราคา - เชียงใหม่ ซักอบรีด</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--tx:#1a2233;--mut:#667;--pri:#1d4ed8;--bd:#d5dbe5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#1a2132;--tx:#e8ecf4;--mut:#9aa5ba;--pri:#6b9bff;--bd:#2c3650}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#1a2132;--tx:#e8ecf4;--mut:#9aa5ba;--pri:#6b9bff;--bd:#2c3650}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;font-size:16px}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.panel input,.panel select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.btns{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
button{padding:10px 18px;border:0;border-radius:8px;background:var(--pri);color:#fff;font:inherit;cursor:pointer}
button.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.hint{grid-column:1/-1;font-size:13px;color:var(--mut)}
.paper{background:#fff;color:#111;border-radius:6px;padding:28px 24px;box-shadow:0 2px 12px #0002}
.head{display:flex;gap:16px;align-items:center;border-bottom:2px solid #1d4ed8;padding-bottom:12px}
.logo{width:150px;max-width:35%;height:auto;flex:none;background:#fff}
.co{color:#1d4ed8}.co h1{margin:0;font-size:20px}.co div{font-size:14px}
h2{text-align:center;color:#1d4ed8;margin:18px 0 2px;font-size:20px}
.sub{text-align:center;color:#1d4ed8;margin-bottom:14px}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #333;padding:6px 10px}
th{background:#e8f0ff;color:#1d4ed8}
td.p{text-align:center;width:130px;color:#1d4ed8;font-weight:600;padding:2px}
td.p input{width:100%;border:0;background:transparent;text-align:center;font:inherit;color:#1d4ed8;font-weight:600;padding:4px}
td.n{text-align:center;width:48px}
.note{margin-top:12px;font-size:14px}
.sign{margin-top:26px;text-align:center}
.sign .line{margin:34px auto 4px;width:200px;border-bottom:1px solid #333}
.ft{margin-top:16px;border-top:1px solid #ccc;padding-top:8px;font-size:14px;color:#c00;text-align:center}
@media print{body{background:#fff}.panel{display:none}.wrap{padding:0}.paper{box-shadow:none;padding:0}td.p input{color:#1d4ed8}}
</style></head><body>
<div class="wrap">
<div class="panel">
 <div><label>ประเภทลูกค้า</label><select id="type"></select></div>
 <div><label>ชื่อลูกค้า</label><input id="cust" placeholder="เช่น โรงแรมสบายใจ"></div>
 <div><label>วันที่เสนอราคา</label><input id="date" type="date"></div>
 <div class="hint">คลิกที่ตัวเลขราคาในตารางเพื่อแก้ไขได้ก่อนพิมพ์ (เปลี่ยนประเภทลูกค้าจะรีเซ็ตเป็นราคามาตรฐาน)</div>
 <div class="btns"><button onclick="window.print()">พิมพ์ / บันทึก PDF</button><button class="alt" onclick="render(true)">รีเซ็ตราคา</button></div>
</div>
<div class="paper" id="paper"></div>
</div>
